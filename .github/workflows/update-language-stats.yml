name: Atualizar gráfico de linguagens

on:
  push:
    paths:
      - "README.md"
      - "scripts/update_language_stats.py"
      - ".github/workflows/update-language-stats.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-language-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate chart
        run: python scripts/update_language_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Carlos-Eduardo-MA
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-stats.svg
          if git diff --cached --quiet; then
            echo "Language chart is already up to date."
            exit 0
          fi
          git commit -m "chore: update language stats"
          git push
